name: Emulator test

on:
  workflow_dispatch:
    inputs:
      url:
        description: Story link to test with
        required: false
        default: http://10.0.2.2:8000/index.html

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch WebToEpub and foliate-js
        run: |
          git clone --depth 1 https://github.com/dteviot/WebToEpub.git webtoepub
          cd webtoepub
          git rev-parse --short HEAD > plugin/w2e_commit.txt
          npm install --omit=dev --ignore-scripts --no-audit --no-fund
          mkdir -p plugin/@zip.js/zip.js/dist plugin/dompurify/dist
          cp node_modules/@zip.js/zip.js/dist/zip-no-worker.min.js plugin/@zip.js/zip.js/dist/
          cp node_modules/dompurify/dist/purify.min.js plugin/dompurify/dist/
          cd ..
          git clone --depth 1 https://github.com/readest/foliate-js.git foliate

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Serve local test story
        run: |
          python3 .github/e2e/site.py "$RUNNER_TEMP/site"
          cd "$RUNNER_TEMP/site" && nohup python3 -m http.server 8000 > "$RUNNER_TEMP/http.log" 2>&1 &
          sleep 2 && curl -sf http://127.0.0.1:8000/index.html | head -c 200

      - name: Start WebDAV server
        run: |
          pip install --quiet wsgidav cheroot
          mkdir -p "$RUNNER_TEMP/dav"
          cat > "$RUNNER_TEMP/dav.yaml" <<EOF
          host: 0.0.0.0
          port: 8090
          provider_mapping:
            "/": "$RUNNER_TEMP/dav"
          http_authenticator:
            domain_controller: null
            accept_basic: true
            accept_digest: false
            default_to_digest: false
          simple_dc:
            user_mapping:
              "*":
                "tester":
                  password: "secret"
          EOF
          nohup wsgidav --config "$RUNNER_TEMP/dav.yaml" > "$RUNNER_TEMP/dav.log" 2>&1 &
          sleep 3 && curl -s -o /dev/null -w "webdav %{http_code}\n" -u tester:secret -X PROPFIND -H "Depth: 0" http://127.0.0.1:8090/

      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          E2E_URL: ${{ github.event.inputs.url }}
          DAV_ROOT: ${{ runner.temp }}/dav
          SITE_DIR: ${{ runner.temp }}/site
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: timeout 2700 bash .github/e2e/run.sh || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-results
          retention-days: 14
          path: e2e-out/
