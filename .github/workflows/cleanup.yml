name: Repo cleanup (one-off)

# Removes everything that still points at the old, pre-release history: all releases and
# tags, every branch except main, and old workflow runs (their logs and artifacts).
# Run it once from Actions → "Repo cleanup (one-off)" → Run workflow. It deletes this file when done.
on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - name: Delete releases
        run: |
          gh api --paginate "repos/$REPO/releases?per_page=100" --jq '.[].id' | while read id; do
            gh api -X DELETE "repos/$REPO/releases/$id" && echo "deleted release $id"
          done

      - name: Delete tags
        run: |
          gh api --paginate "repos/$REPO/git/matching-refs/tags" --jq '.[].ref' | while read ref; do
            gh api -X DELETE "repos/$REPO/git/${ref#refs/}" && echo "deleted $ref"
          done

      - name: Delete branches other than main
        run: |
          gh api --paginate "repos/$REPO/branches?per_page=100" --jq '.[].name' | grep -vx main | while read b; do
            gh api -X DELETE "repos/$REPO/git/refs/heads/$b" && echo "deleted branch $b"
          done

      - name: Delete old workflow runs
        run: |
          gh api --paginate "repos/$REPO/actions/runs?per_page=100" --jq '.workflow_runs[].id' | while read id; do
            [ "$id" = "${{ github.run_id }}" ] && continue
            gh api -X DELETE "repos/$REPO/actions/runs/$id" >/dev/null && echo "deleted run $id"
          done

      - uses: actions/checkout@v4
      - name: Remove this workflow
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git rm -q .github/workflows/cleanup.yml
          git commit -q -m "Remove one-off cleanup workflow"
          git push
