name: Sync tests

# Runs the WebDAV and Supabase sync backends against real servers:
# wsgidav for WebDAV, and a local Supabase stack with docs/supabase.sql applied.
on:
  push:
    branches: [main]
    paths: ["app/src/main/java/com/epubforge/sync/**", "app/src/test/java/com/epubforge/sync/**", "docs/supabase.sql", ".github/workflows/sync-tests.yml"]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch WebToEpub and foliate-js
        run: |
          git clone --depth 1 https://github.com/dteviot/WebToEpub.git webtoepub
          cd webtoepub
          npm install --omit=dev --ignore-scripts --no-audit --no-fund
          mkdir -p plugin/@zip.js/zip.js/dist plugin/dompurify/dist
          cp node_modules/@zip.js/zip.js/dist/zip-no-worker.min.js plugin/@zip.js/zip.js/dist/
          cp node_modules/dompurify/dist/purify.min.js plugin/dompurify/dist/
          cd ..
          git clone --depth 1 https://github.com/readest/foliate-js.git foliate

      - name: Start WebDAV server
        run: |
          pip install --quiet wsgidav cheroot
          mkdir -p "$RUNNER_TEMP/dav"
          printf '%s\n' \
            'host: 127.0.0.1' 'port: 8090' 'provider_mapping:' "  \"/\": \"$RUNNER_TEMP/dav\"" \
            'http_authenticator:' '  domain_controller: null' '  accept_basic: true' '  accept_digest: false' '  default_to_digest: false' \
            'simple_dc:' '  user_mapping:' '    "*":' '      "tester":' '        password: "secret"' > "$RUNNER_TEMP/dav.yaml"
          nohup wsgidav --config "$RUNNER_TEMP/dav.yaml" > "$RUNNER_TEMP/dav.log" 2>&1 &
          sleep 3
          curl -sf -o /dev/null -u tester:secret -X PROPFIND -H "Depth: 0" http://127.0.0.1:8090/ && echo "WebDAV up"

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase and apply the setup script
        run: |
          mkdir -p "$RUNNER_TEMP/sb" && cd "$RUNNER_TEMP/sb"
          supabase init --force
          supabase start -x studio,imgproxy,edge-runtime,logflare,vector,realtime,storage-api
          supabase status -o env > status.env
          sed -n 's/^\(API_URL\|ANON_KEY\|DB_URL\)=/\1=/p' status.env
          set -a; . ./status.env; set +a
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f "$GITHUB_WORKSPACE/docs/supabase.sql"
          # Applying it twice must also work (people re-run setup scripts).
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f "$GITHUB_WORKSPACE/docs/supabase.sql"
          echo "SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "SUPABASE_ANON_KEY=$ANON_KEY" >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Run sync tests
        env:
          WEBDAV_URL: http://127.0.0.1:8090/
          WEBDAV_USER: tester
          WEBDAV_PASS: secret
        run: gradle :app:testDebugUnitTest --tests 'com.epubforge.sync.*' --no-daemon

      - name: Check no test was skipped
        run: |
          f=$(ls app/build/test-results/testDebugUnitTest/TEST-com.epubforge.sync.SyncBackendsTest.xml)
          grep -o 'tests="[0-9]*" skipped="[0-9]*" failures="[0-9]*" errors="[0-9]*"' "$f"
          grep -q 'skipped="0" failures="0" errors="0"' "$f"
